name: Snapshot

on:
  workflow_dispatch:
    inputs:
      output:
        description: "Send to Slack or save as a workflow artifact"
        required: false
        default: "slack"
        type: choice
        options:
          - slack
          - file
  # Scheduling is now driven externally by cron-job.org, which calls the GitHub
  # workflow_dispatch REST endpoint at the desired ET wall-clock times. This
  # workflow no longer owns any cron schedule or ET-hour gating logic.
  # See docs/SCHEDULING.md for the external trigger setup and timing details.

permissions:
  contents: read

jobs:
  snapshot:
    name: ${{ matrix.report.title }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        report:
          # Ranges extended to include the totals rows (Total # of sales /
          # Total amount / Average sale), which moved past row 25 as reps were
          # added. only_ranked drops the per-rep helper rows in between.
          - key: daily
            title: "Daily Sales Report"
            range: "B1:E50"
          - key: monthly
            title: "Monthly Sales Report"
            range: "G1:J50"
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Install Playwright Chromium (with system deps)
        run: |
          # GitHub's ubuntu-24.04 runner ships a Google Chrome apt repo that
          # intermittently returns "Hash Sum mismatch", making the apt-get update
          # inside `--with-deps` fail with exit 100. We use Playwright's bundled
          # Chromium (not Google Chrome), so drop that repo, then install with a
          # few retries to ride out transient apt mirror hiccups.
          sudo rm -f /etc/apt/sources.list.d/*google* 2>/dev/null || true
          for attempt in 1 2 3; do
            uv run playwright install --with-deps chromium && exit 0
            echo "::warning::playwright install attempt $attempt failed; retrying in 15s"
            sleep 15
          done
          echo "::error::playwright install failed after 3 attempts"
          exit 1

      - name: Write Google service-account credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Run ${{ matrix.report.title }} snapshot
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SPREADSHEET_ID: "12glaANnP2BsQfH_kHfRlzA40JdWAU-PJgDT-56yRV8k"
          GID: "170384010"
          OUTPUT: ${{ inputs.output || 'slack' }}
          REPORT_RANGE: ${{ matrix.report.range }}
          REPORT_TITLE: ${{ matrix.report.title }}
          REPORT_KEY: ${{ matrix.report.key }}
          ONLY_RANKED: "1"
        run: |
          if [ "$OUTPUT" = "file" ]; then
            uv run python scripts/snapshot.py \
              --spreadsheet-id "$SPREADSHEET_ID" \
              --gid "$GID" \
              --range "$REPORT_RANGE" \
              --title "$REPORT_TITLE" \
              --output file \
              --out-path "snapshot-${REPORT_KEY}.png"
          else
            uv run python scripts/snapshot.py \
              --spreadsheet-id "$SPREADSHEET_ID" \
              --gid "$GID" \
              --range "$REPORT_RANGE" \
              --title "$REPORT_TITLE" \
              --output slack
          fi

      - name: Upload PNG as workflow artifact
        if: ${{ inputs.output == 'file' }}
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ matrix.report.key }}
          path: snapshot-${{ matrix.report.key }}.png
          if-no-files-found: error
          retention-days: 7
