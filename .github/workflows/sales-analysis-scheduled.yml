name: Sales Analysis (scheduled)

on:
  workflow_dispatch:
    inputs:
      gate:
        description: "Cadence guard evaluated in ET (script posts only if it matches)"
        required: false
        type: choice
        default: "first-monday"
        options:
          - first-monday
          - last-day
          - none
  # No in-workflow schedule. Two cron-job.org jobs hit this workflow's
  # workflow_dispatch REST endpoint (see docs/SETUP-sales-analysis.md):
  #   - every Monday  -> inputs.gate = first-monday  (script posts only on the 1st Monday)
  #   - days 28-31    -> inputs.gate = last-day      (script posts only on the true last day)
  # Both post BOTH charts (weekly + monthly) as one Slack message.

permissions:
  contents: read

jobs:
  sales-analysis:
    name: Sales Analysis (scheduled)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Install Playwright Chromium (with system deps)
        run: uv run playwright install --with-deps chromium

      - name: Write Google service-account credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Run scheduled sales-analysis charts
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SPREADSHEET_ID: "12glaANnP2BsQfH_kHfRlzA40JdWAU-PJgDT-56yRV8k"
          GID: "1867438179"
          GATE: ${{ inputs.gate || 'first-monday' }}
        run: |
          uv run python scripts/sales_analysis.py --kind both --gate "$GATE" --output slack
