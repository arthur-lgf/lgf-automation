name: Approvals Report (Monthly)

on:
  workflow_dispatch:
    inputs:
      output:
        description: "Send to Slack or save as a workflow artifact"
        required: false
        default: "slack"
        type: choice
        options:
          - slack
          - file
  # Scheduling is driven externally by cron-job.org, which calls this workflow's
  # workflow_dispatch REST endpoint on the 1st of each month (run it on the 1st,
  # ET morning, so it reports the calendar month that just ended). Same PAT /
  # cron-job.org flow as approvals.yml; just point a new job at THIS workflow's
  # /dispatches URL. See docs/SCHEDULING.md.

permissions:
  contents: read

jobs:
  approvals-monthly:
    name: Approvals Report (Monthly)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Install Playwright Chromium (with system deps)
        run: |
          # GitHub's ubuntu-24.04 runner ships a Google Chrome apt repo that
          # intermittently returns "Hash Sum mismatch", making the apt-get update
          # inside `--with-deps` fail with exit 100. We use Playwright's bundled
          # Chromium (not Google Chrome), so drop that repo, then install with a
          # few retries to ride out transient apt mirror hiccups.
          sudo rm -f /etc/apt/sources.list.d/*google* 2>/dev/null || true
          for attempt in 1 2 3; do
            uv run playwright install --with-deps chromium && exit 0
            echo "::warning::playwright install attempt $attempt failed; retrying in 15s"
            sleep 15
          done
          echo "::error::playwright install failed after 3 attempts"
          exit 1

      - name: Write Google service-account credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Run monthly approvals report
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          # Optional: a dedicated channel for approvals. If this secret is unset,
          # the report falls back to SLACK_CHANNEL_ID.
          APPROVALS_CHANNEL_ID: ${{ secrets.APPROVALS_CHANNEL_ID }}
          # Optional: a dedicated bot for approvals. If unset, falls back to
          # SLACK_BOT_TOKEN. The bot must be a member of APPROVALS_CHANNEL_ID.
          APPROVALS_SLACK_BOT_TOKEN: ${{ secrets.APPROVALS_SLACK_BOT_TOKEN }}
          OUTPUT: ${{ inputs.output || 'slack' }}
        run: |
          if [ "$OUTPUT" = "file" ]; then
            uv run python scripts/approvals.py --period last-month --output file --out-path approvals-monthly.png
          else
            uv run python scripts/approvals.py --period last-month --output slack
          fi

      - name: Upload PNG as workflow artifact
        if: ${{ inputs.output == 'file' }}
        uses: actions/upload-artifact@v4
        with:
          name: approvals-monthly
          path: approvals-monthly.png
          if-no-files-found: error
          retention-days: 7
