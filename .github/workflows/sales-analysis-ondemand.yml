name: Sales Analysis (on demand)

on:
  workflow_dispatch:
    inputs:
      report:
        description: "Which sales-analysis chart to post"
        required: false
        type: choice
        default: "weekly"
        options:
          - weekly
          - monthly
      channel:
        description: "Slack channel ID to post to (default: SLACK_CHANNEL_ID)"
        required: false
        type: string
  # No schedule: this workflow exists for the Slack `/salesanalysis` command,
  # fired via the workflow_dispatch REST endpoint (through the Vercel listener).
  # The scheduled charts live in sales-analysis-scheduled.yml.

permissions:
  contents: read

jobs:
  sales-analysis:
    name: Sales Analysis (on demand)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Install Playwright Chromium (with system deps)
        run: |
          # GitHub's ubuntu-24.04 runner ships a Google Chrome apt repo that
          # intermittently returns "Hash Sum mismatch", making the apt-get update
          # inside `--with-deps` fail with exit 100. We use Playwright's bundled
          # Chromium (not Google Chrome), so drop that repo, then install with a
          # few retries to ride out transient apt mirror hiccups.
          sudo rm -f /etc/apt/sources.list.d/*google* 2>/dev/null || true
          for attempt in 1 2 3; do
            uv run playwright install --with-deps chromium && exit 0
            echo "::warning::playwright install attempt $attempt failed; retrying in 15s"
            sleep 15
          done
          echo "::error::playwright install failed after 3 attempts"
          exit 1

      - name: Write Google service-account credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Run on-demand sales-analysis chart
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          # /salesanalysis passes the channel it was invoked in; else SLACK_CHANNEL_ID.
          SLACK_CHANNEL_ID: ${{ inputs.channel || secrets.SLACK_CHANNEL_ID }}
          SPREADSHEET_ID: "12glaANnP2BsQfH_kHfRlzA40JdWAU-PJgDT-56yRV8k"
          GID: "1867438179"
          KIND: ${{ inputs.report || 'weekly' }}
        run: |
          uv run python scripts/sales_analysis.py --kind "$KIND" --output slack
